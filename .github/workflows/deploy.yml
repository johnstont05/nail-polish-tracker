name: Deploy to main site

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glossary repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Checkout main site repo
        uses: actions/checkout@v4
        with:
          repository: johnstont05/johnstont05.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: main-site

      - name: Copy build output
        run: |
          rm -rf main-site/static/nail-polish-tracker
          mkdir -p main-site/static/nail-polish-tracker
          cp -r dist/* main-site/static/nail-polish-tracker/

      - name: Commit and push
        run: |
          cd main-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/nail-polish-tracker
          git diff --staged --quiet || git commit -m "deploy: update nail-polish-tracker"
          git push
